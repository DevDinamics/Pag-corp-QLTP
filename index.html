<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════
         BÁSICOS SEO
    ═══════════════════════════════════════ -->
    <title>Qualtop | Transformación Digital y Desarrollo de Software</title>
    <meta name="description" content="Impulsamos tu negocio con soluciones de desarrollo de software a la medida, inteligencia artificial y modernización tecnológica. Descubre cómo ayudamos a empresas líderes." />
    <link rel="canonical" href="https://qualtop.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050505" />

    <!-- ═══════════════════════════════════════
         FAVICONS
    ═══════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- FIX: ícono nítido al guardar en pantalla de inicio en iOS -->
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ═══════════════════════════════════════
         OPEN GRAPH — WhatsApp, Facebook, Slack
    ═══════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Qualtop" />
    <meta property="og:url"         content="https://qualtop.com/" />
    <meta property="og:title"       content="Qualtop | Transformación Digital Corporativa" />
    <meta property="og:description" content="Soluciones de desarrollo de software, inteligencia artificial y modernización tecnológica para empresas líderes." />
    <!-- FIX: imagen actualizada + dimensiones explícitas para WhatsApp -->
    <meta property="og:image"        content="https://qualtop.com/OpenGraph.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Qualtop — Transformación Digital Corporativa" />

    <!-- ═══════════════════════════════════════
         TWITTER / X
    ═══════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://qualtop.com/" />
    <meta name="twitter:title"       content="Qualtop | Transformación Digital" />
    <meta name="twitter:description" content="Soluciones de desarrollo de software, inteligencia artificial y modernización tecnológica." />
    <meta name="twitter:image"       content="https://qualtop.com/OpenGraph.png" />

    <!-- ═══════════════════════════════════════
         SCHEMA.ORG — Rich results en Google
    ═══════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://qualtop.com/#organization",
          "name": "Qualtop",
          "url": "https://qualtop.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://qualtop.com/favicon.png"
          },
          "description": "Soluciones de desarrollo de software a la medida, inteligencia artificial y modernización tecnológica para empresas líderes.",
         "sameAs": [
                   "https://www.linkedin.com/company/qualtopgroup/",
                   "https://www.instagram.com/qualtop_",
                   "https://www.facebook.com/qualtop"
                    ]
        },
        {
          "@type": "WebSite",
          "@id": "https://qualtop.com/#website",
          "url": "https://qualtop.com",
          "name": "Qualtop",
          "publisher": {
            "@id": "https://qualtop.com/#organization"
          }
        },
        {
          "@type": "WebPage",
          "@id": "https://qualtop.com/#webpage",
          "url": "https://qualtop.com",
          "name": "Qualtop | Transformación Digital y Desarrollo de Software",
          "description": "Impulsamos tu negocio con soluciones de desarrollo de software a la medida, inteligencia artificial y modernización tecnológica.",
          "isPartOf": {
            "@id": "https://qualtop.com/#website"
          }
        }
      ]
    }
    </script>

    <!-- ═══════════════════════════════════════
         FUENTES — preconnect + font-display:swap
         FIX: font-display=swap evita que el texto
         sea invisible mientras carga Poppins
    ═══════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap&font-display=swap"
      rel="stylesheet"
    />

    <!-- ═══════════════════════════════════════
         PRELOAD imagen hero
         FIX: elimina el delay visual en el hero
         — cambia la ruta si tu imagen tiene otro nombre
    ═══════════════════════════════════════ -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/Carrers-image/image-2.carrers.jpg"
      fetchpriority="high"
    />

    <!-- ═══════════════════════════════════════
         reCAPTCHA — carga diferida
         FIX: ya no bloquea el render inicial.
         Se carga solo cuando el usuario interactúa.
         Tu clave pública queda igual.
    ═══════════════════════════════════════ -->
    <script>
      // Carga reCAPTCHA solo cuando el usuario hace scroll o toca la página
      function loadRecaptcha() {
        if (window._recaptchaLoaded) return;
        window._recaptchaLoaded = true;
        const s = document.createElement('script');
        s.src = 'https://www.google.com/recaptcha/api.js?render=6LeXCr0sAAAAAAIxiMH34WPnYqV46m_7X7p-R78H';
        s.async = true;
        document.head.appendChild(s);
      }
      window.addEventListener('scroll',     loadRecaptcha, { once: true });
      window.addEventListener('touchstart', loadRecaptcha, { once: true });
      window.addEventListener('mousemove',  loadRecaptcha, { once: true });
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
